kind: wasmer.io/App.v0
name: ticketing-api
owner: firmangandhi361
package: .
app_id: da_K1EIZtMUeNZA
annotations:
  anybuild.run/config:
    commands:
      start: uvicorn main:app --interface=wsgi --host 0.0.0.0 --port $PORT
    name: out
    python_cross_platform: wasix_wasm32
    python_extra_dependencies:
    - uvicorn
    python_extra_index_url: https://python-registry.wasix.org/simple
    python_framework: flask
    python_install_inputs:
    - requirements.txt
    python_main_file: main.py
    python_server: uvicorn
    wsgi_application: main:app
  anybuild.run/provider: python
  anybuild.run/version: 0.33.3
  wasmer.io/version: 7.5.0
capabilities:
  database:
    engine: postgres
locality:
  regions:
    - fr-roub1
enableDatabase: true
